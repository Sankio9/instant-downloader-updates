name: RC15 responsive layout QA screenshot (no release)
on:
  push:
    paths:
      - '.github/workflows/qa-rc15.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate RC14 SHA and assemble RC15 files
        id: prep
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $m=Get-Content latest.json -Raw | ConvertFrom-Json
          if($m.version -ne '1.8.0-rc.14'){throw 'Expected RC14 base release'}
          Invoke-WebRequest -Uri $m.package_url -OutFile old.zip -UseBasicParsing -TimeoutSec 120
          if((Get-FileHash old.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $m.sha256){throw 'RC14 base checksum invalid'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead((Join-Path $PWD old.zip))
          try{$oldFileNames=@($z.Entries | ForEach-Object {$_.FullName})}finally{$z.Dispose()}
          if($oldFileNames.Count -lt 20){throw 'Incomplete RC14 baseline'}
          Expand-Archive old.zip -DestinationPath payload
          foreach($name in @('Instant_Downloader.ps1','package.json','Install_Instant_Downloader.ps1')){
            Copy-Item -LiteralPath (Join-Path patches/rc15 $name) -Destination (Join-Path payload $name) -Force
          }
          # Test-only fixture: not shipped because RC7 updaters reject new file names.
          Copy-Item -LiteralPath patches/rc13/test_lesson_ui.cjs -Destination payload/test_lesson_ui.cjs
          Copy-Item -LiteralPath patches/rc13/test_sidebar_order.cjs -Destination payload/test_sidebar_order.cjs
          Copy-Item -LiteralPath patches/rc12/test_lesson_documents.cjs -Destination payload/test_lesson_documents.cjs
          Copy-Item -LiteralPath patches/rc15/test_rc15_winforms.ps1 -Destination payload/test_rc15_winforms.ps1
          if((Get-Content payload/package.json -Raw | ConvertFrom-Json).version -ne '1.8.0-rc.15'){throw 'RC15 version mismatch'}
          $code=Get-Content payload/bridge.mjs -Raw
          if(!$code.Contains('selectionApi.uiApi') -or !$code.Contains('selectionApi.documentsApi')){throw 'Bundled compatibility modules missing'}
          foreach($file in @('config.json','cookies.txt','.auth','storage_state.json','node_modules')){
            if(Test-Path (Join-Path payload $file)){throw 'Sensitive machine data included'}
          }

      - name: PowerShell 5.1 parser validation
        id: ps
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in Get-ChildItem payload -Filter '*.ps1'){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|ForEach-Object{Write-Host $_};throw "Invalid PowerShell: $($file.Name)"}
          }

      - name: Live progress controls test on Windows Forms
        id: ui
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $source=Get-Content -LiteralPath payload/Instant_Downloader.ps1 -Raw -Encoding UTF8
          if(!$source.Contains("MakeLabel (Tr 'language') 600 22 100 24")){throw 'Language caption will be clipped'}
          if(!$source.Contains('$languageBox.SetBounds(708,17,168,30)')){throw 'Language selector is too narrow'}
          if($source.Contains("[                    ]") -or $source.Contains("('='+")){throw 'Old ASCII progress bar still present'}
          $from=$source.IndexOf('function RefreshProgressArea(){')
          $to=$source.IndexOf('function GetProcessTree(',$from)
          if($from -lt 0 -or $to -le $from){throw 'Progress UI methods missing'}
          function Tr([string]$key){$h=@{noActive='No active downloads';completedSuccess='Download completed successfully';completedWithErrors='Download completed with errors:'};return [string]$h[$key]}
          function Color([string]$hex){return [Drawing.ColorTranslator]::FromHtml($hex)}
          $script:entries=@()
          $script:slotItems=@{}
          $script:slotOrder=New-Object Collections.ArrayList
          $script:failedVideos=@{}
          $script:completeErrors=0
          $script:completionTextKey=''
          $script:progressSummary=New-Object Windows.Forms.Label
          foreach($i in 0..3){
            $script:entries+=@{index=$i;name=(New-Object Windows.Forms.Label);bar=(New-Object Windows.Forms.ProgressBar);pct=(New-Object Windows.Forms.Label);active=$false;finished=$false}
          }
          . ([scriptblock]::Create($source.Substring($from,$to-$from)))
          ResetSlots
          if(@($script:entries|Where-Object {$_.name.Visible}).Count -ne 0){throw 'Idle must hide all progress rows'}
          if($script:progressSummary.Text -ne 'No active downloads'){throw 'Idle status missing'}
          SetSlot 'lesson-a' 'Lesson A' 30
          if(@($script:entries|Where-Object {$_.name.Visible}).Count -ne 1){throw 'Only one started lesson should be visible'}
          if(@($script:entries|Where-Object {$_.pct.Visible -and $_.pct.Text -eq '30%'}).Count -ne 1){throw 'Show percentage only, not ASCII text'}
          SetSlot 'lesson-b' 'Lesson B' 54
          if(@($script:entries|Where-Object {$_.name.Visible}).Count -ne 2){throw 'Two active lessons should be visible'}
          SetSlot 'lesson-a' 'Lesson A' 100 'done'
          if(@($script:entries|Where-Object {$_.name.Visible}).Count -ne 1){throw 'Completed lesson should disappear from active area'}
          SetSlot 'lesson-b' 'Lesson B' 0 'failed'
          if(@($script:entries|Where-Object {$_.name.Visible}).Count -ne 0){throw 'No phantom progress bars after finishing'}
          $script:completionTextKey='completedSuccess'
          RefreshProgressArea
          if(!$script:progressSummary.Visible -or $script:progressSummary.Text -ne 'Download completed successfully'){throw 'Success message missing'}
          $script:completeErrors=2
          $script:completionTextKey='completedWithErrors'
          RefreshProgressArea
          if($script:progressSummary.Text -ne 'Download completed with errors: 2'){throw 'Error count/result missing'}
          Write-Host 'PASS WinForms: language label, zero idle rows, two active rows, no ASCII, clean completion/error state'

      - name: Simulate approved pastel UI on real Windows Forms controls
        id: learning_workspace
        shell: powershell
        working-directory: payload
        env:
          RC15_SCREENSHOT_PATH: ${{ github.workspace }}\qa\RC15-pastel-winforms.png
        run: |
          $ErrorActionPreference='Stop'
          & ./test_rc15_winforms.ps1
          if($LASTEXITCODE -and $LASTEXITCODE -ne 0){throw 'Pastel WinForms regression failed'}

      - name: Course order, offline HTML and regression suites
        id: tests
        shell: pwsh
        working-directory: payload
        run: |
          $ErrorActionPreference='Stop'
          node --check selection.cjs
          if($LASTEXITCODE){throw 'JS bundling failed'}
          node --check bridge.mjs
          if($LASTEXITCODE){throw 'Bridge syntax failed'}
          foreach($name in @('test_sidebar_order.cjs','test_lesson_ui.cjs','test_lesson_documents.cjs','test_v17.cjs','test_v16.cjs','test_audit.cjs','test_upgrade.cjs')){
            node $name
            if($LASTEXITCODE){throw "Regression failed: $name"}
          }

      - name: Node integration test on Windows
        id: node
        shell: pwsh
        working-directory: payload
        run: |
          $ErrorActionPreference='Stop'
          npm install --no-save --no-audit --no-fund typescript@5.9.3
          if($LASTEXITCODE){throw 'npm installation failed'}
          $src=Get-Content test_local.cjs -Raw
          $old="require('/opt/nvm/versions/node/v22.16.0/lib/node_modules/typescript')"
          if($src.Contains($old)){[IO.File]::WriteAllText((Join-Path $PWD test_local.cjs),$src.Replace($old,"require('typescript')"),[Text.UTF8Encoding]::new($false))}
          node test_local.cjs
          if($LASTEXITCODE){throw 'Local integration failed'}

      - name: Save sanitized WinForms screenshot for review
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='qa/RC15-pastel-winforms.png'
          if(!(Test-Path $path)){throw 'UI screenshot not produced'}
          if((Get-Item $path).Length -lt 3000){throw 'WinForms screenshot unexpectedly small'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          if(-not (git diff --cached --quiet)){
            git commit -m 'Capture RC15 WinForms preview with fake local data'
            git push
            if($LASTEXITCODE){throw 'Screenshot upload failed'}
          }
